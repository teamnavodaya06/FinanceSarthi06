version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: financesarthi-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: financesarthi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: financesarthi-redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: financesarthi-backend
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/financesarthi?schema=public
      PORT: 5000
      JWT_SECRET: super-secret-jwt-key
      AI_SERVICE_URL: http://ai-service:8000
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL}
      NVIDIA_MODEL: ${NVIDIA_MODEL}
      AI_PROVIDER: ${AI_PROVIDER}
    depends_on:
      - postgres
      - redis

  ai-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.ai-service
    container_name: financesarthi-ai
    ports:
      - "8000:8000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL}
      NVIDIA_MODEL: ${NVIDIA_MODEL}
      AI_PROVIDER: ${AI_PROVIDER}

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: financesarthi-web
    ports:
      - "80:80"
    depends_on:
      - backend
      - ai-service

volumes:
  pgdata:
