name: Pull Request Verification (CI)

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  verify:
    name: Lint, Typecheck & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (22.x)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
            ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Dependencies
        run: npm install

      - name: Run Linting Checks
        run: npm run lint --if-present

      - name: Run Calculations Unit Tests
        run: npx ts-node apps/backend/src/tests/calculations.test.ts

      - name: Run Validation Unit Tests
        run: npx ts-node apps/backend/src/tests/validation.test.ts

      - name: Run Expense Validation Unit Tests
        run: npx ts-node apps/backend/src/tests/expense-validation.test.ts

      - name: Run AI Quality & Evaluation Framework Suite
        run: npm run test:ai-eval

      - name: Production Build Verification
        run: npm run build
