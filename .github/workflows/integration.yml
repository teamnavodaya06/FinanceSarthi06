name: System Integration & Emulator Verification

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  integration:
    name: Run Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (22.x)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java (for Firebase Emulators)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
            ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Dependencies
        run: npm install

      # Setup and start Firebase Emulator to verify security rules and NoSQL integrity
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Run System Integration QA Tests
        run: npx ts-node apps/backend/src/tests/income-system.test.ts
