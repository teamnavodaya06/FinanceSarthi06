<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinanceSarthi | India's Smartest AI Financial Companion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
      .goog-te-banner-frame,
      .goog-te-banner-frame.skiptranslate,
      iframe.goog-te-banner-frame,
      .skiptranslate {
        display: none !important;
      }
      body {
        top: 0px !important;
      }
      #google_translate_element {
        position: absolute;
        left: -9999px;
        top: -9999px;
        visibility: hidden;
      }
      font {
        background-color: transparent !important;
        box-shadow: none !important;
      }
    </style>
    <script type="text/javascript">
      // Enforce English as absolute default language on initial site load
      if (!localStorage.getItem('sarthi_lang_pref')) {
        localStorage.setItem('sarthi_lang_pref', 'English');
      }
      var savedLangPref = localStorage.getItem('sarthi_lang_pref');
      if (savedLangPref === 'English' || !savedLangPref) {
        document.cookie = "googtrans=/en/en; path=/;";
        document.cookie = "googtrans=/en/en; path=/; domain=" + window.location.hostname;
      }

      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'en',
          includedLanguages: 'en,hi,bn,ta,te,mr,kn,gu,pa,ml',
          autoDisplay: false
        }, 'google_translate_element');
      }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
  </head>
  <body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-emerald-500 selection:text-slate-950">
    <div id="google_translate_element"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
